<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Job Automation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%231b1a17'/%3E%3Cpath d='M9 17.5 11.2 11h9.6L23 17.5v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 9 21.5z M9 17.5h4l1 2h4l1-2h4' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/IBMPlexSans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved appearance and language before the first paint: no white flash, no left-to-right flash.
    (function () {
      try {
        var pref = localStorage.getItem("appearance") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var lang = localStorage.getItem("lang") || localStorage.getItem("guide-lang") || "en";
        document.documentElement.setAttribute("lang", lang === "ar" ? "ar" : "en");
        document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css?v=18">
</head>
<body>
  <div id="root" style="height:100%"></div>
  <script src="/static/i18n.js?v=18" defer></script>
  <script src="/static/guide.js?v=18" defer></script>
  <script src="/static/app.js?v=18" defer></script>
</body>
</html>
